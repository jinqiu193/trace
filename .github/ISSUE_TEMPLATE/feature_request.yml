name: Feature request / 功能建议
description: Suggest an idea for Trace / 为 Trace 提出新想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Great ideas are welcome! Please describe the problem first, not just the solution.
        欢迎提建议！请先描述要解决的问题，而不只是想要的功能。
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: What are you trying to do that is hard or impossible today? / 目前做起来困难或无法完成的事是什么？
      placeholder: I'm always frustrated when... / 当我……时总是很麻烦。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: How would you like it to work? / 你期望它如何工作？
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: dropdown
    id: kind
    attributes:
      label: Type / 类型
      options:
        - New file type support / 新文件类型支持
        - Search quality / 检索质量
        - UI / UX
        - Performance / 性能
        - Model / embeddings / 模型与嵌入
        - Other / 其他
    validations:
      required: true
